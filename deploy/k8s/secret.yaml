# Kubernetes Secret template for AgentRT gateway Module
# Version: 0.1.15
#
# 本文件是模板：占位值不可直接用于生产。真实值经命令行生成并
# 创建（避免把明文凭证提交进版本库）：
#
#   kubectl -n agentrt-gateway create secret generic agentrt-gateway-secrets \
#     --from-literal=gateway_api_key="$(openssl rand -hex 32)" \
#     --from-literal=jwt_secret="$(openssl rand -hex 32)"
#
# gateway_api_key：WS-2 T-11a 网关入口凭证（客户端以
# `Authorization: Bearer <key>` 携带）。K8s 形态必须配置——
# 未配置时网关 bind 收敛 127.0.0.1（fail-closed），
# Ingress 转发的流量不可达。

apiVersion: v1
kind: Secret
metadata:
  name: agentrt-gateway-secrets
  namespace: agentrt-gateway
  labels:
    app.kubernetes.io/name: agentrt-gateway
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  gateway_api_key: "REPLACE-ME-openssl-rand-hex-32"
  jwt_secret: "REPLACE-ME-openssl-rand-hex-32"
